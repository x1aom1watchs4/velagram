<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NesaOS — watch UI prototype</title>
<style>
:root{color-scheme:dark;--bg:#101d20;--surface:#1b3033;--surface2:#294448;--turq:#80ded3;--blue:#a9d4ff;--brown:#c8a58b;--text:#eff8f5;--muted:#b5c9c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1113;color:var(--text);font:16px system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.layout{display:grid;gap:18px;justify-items:center}.watch{width:min(88vw,466px);aspect-ratio:1;border:10px solid #303b3d;border-radius:50%;background:radial-gradient(circle at 50% 15%,#294448,#101d20 70%);box-shadow:0 18px 60px #0009;overflow:hidden;position:relative;padding:38px 30px;display:flex;flex-direction:column;align-items:center}
.status{width:100%;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.time{font-size:76px;line-height:1.1;font-weight:650;letter-spacing:-5px;margin-top:36px}.date{color:var(--muted);font-size:15px}.widgets{display:flex;gap:10px;margin-top:26px;width:100%}.widget{background:#294448bb;border:1px solid #80ded344;border-radius:20px;padding:12px 8px;flex:1;text-align:center}.widget strong{display:block;font-size:20px}.widget small{color:var(--muted);font-size:11px}.dock{display:flex;gap:18px;margin-top:auto;margin-bottom:7px}.dock button{width:48px;height:48px;border:0;border-radius:17px;background:var(--surface2);color:var(--text);font-size:21px;cursor:pointer}.dock button:focus-visible,.apps button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.panel{position:absolute;inset:0;background:#142528f5;padding:44px 28px;display:none;flex-direction:column}.panel.open{display:flex}.panel h2{margin:2px 0 18px;font-size:21px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.apps button{border:0;border-radius:22px;background:var(--surface2);color:var(--text);padding:12px 3px;font-size:11px;cursor:pointer}.apps i{display:grid;place-items:center;font-style:normal;font-size:23px;width:45px;height:45px;border-radius:50%;background:#80ded322;margin:0 auto 7px}.close{margin-top:auto;border:0;background:var(--turq);color:#092321;padding:12px;border-radius:18px;font-weight:700;cursor:pointer}
.caption{max-width:466px;text-align:center;color:#b5c9c5;font-size:13px}.caption strong{color:#eff8f5}
</style>
</head>
<body>
<main class="layout">
<section class="watch" aria-label="NesaOS round watch UI preview">
<div class="status"><span>20:40</span><span>◉  Bluetooth&nbsp; · &nbsp;▰ 82%</span></div>
<div class="time">20:40</div><div class="date">Sunday · 22 November</div>
<div class="widgets"><div class="widget"><strong>18°</strong><small>WEATHER*</small></div><div class="widget"><strong>♥ 72</strong><small>HEALTH*</small></div></div>
<nav class="dock" aria-label="Quick apps">
<button aria-label="Open apps" onclick="showPanel('apps')">◉</button>
<button aria-label="Open settings" onclick="showPanel('settings')">⚙</button>
</nav>
<section class="panel" id="apps"><h2>Apps</h2><div class="apps">
<button><i>♫</i>Music</button><button><i>▦</i>Calendar</button><button><i>＋</i>Calculator</button>
<button><i>✓</i>Tasks</button><button><i>◈</i>Nesa Faces</button><button><i>◉</i>Nesa Themes</button>
</div><button class="close" onclick="hidePanels()">Back to home</button></section>
<section class="panel" id="settings"><h2>Settings</h2><div class="apps">
<button><i>◉</i>Bluetooth</button><button><i>◐</i>Display</button><button><i>♪</i>Sound</button>
<button><i>♧</i>Battery</button><button><i>⇧</i>Install app*</button><button><i>ⓘ</i>About</button>
</div><button class="close" onclick="hidePanels()">Back to home</button></section>
</section>
<p class="caption"><strong>NesaOS UI concept</strong> · Round-screen layout, Material 3-inspired colors. *Demo-only placeholders; no live weather, health, Bluetooth, or package installation is connected.</p>
</main>
<script>
function showPanel(id){hidePanels();document.getElementById(id).classList.add('open')}
function hidePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'))}
</script>
</body>
</html>
