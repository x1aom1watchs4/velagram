name: Build VelaStore and Mini Games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  velastore:
    name: Build VelaStore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install VelaStore dependencies
        working-directory: watch
        run: npm install --no-audit --no-fund
      - name: Build VelaStore RPK
        working-directory: watch
        run: npm run build
      - name: Find and stage VelaStore RPK
        run: |
          set -euo pipefail
          RPK="$(find . -type f -name '*.debug.*.rpk' -not -path '*/node_modules/*' -print -quit)"
          test -n "$RPK"
          mkdir -p watch/artifacts
          cp "$RPK" watch/artifacts/
      - name: Upload VelaStore debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: VelaStore-Xiaomi-Vela-Debug-RPK
          path: watch/artifacts/*.debug.*.rpk
          if-no-files-found: error

  mini-games:
    name: Build ${{ matrix.game }} game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [tap-rush, memory-match, 2048-mini, snake-lite]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install game dependencies
        working-directory: games/${{ matrix.game }}
        run: npm install --no-audit --no-fund
      - name: Build game RPK
        working-directory: games/${{ matrix.game }}
        run: npm run build
      - name: Find and stage game RPK
        run: |
          set -euo pipefail
          RPK="$(find . -type f -name '*.debug.*.rpk' -not -path '*/node_modules/*' -print -quit)"
          test -n "$RPK"
          mkdir -p games/artifacts
          cp "$RPK" "games/artifacts/${{ matrix.game }}.debug.rpk"
      - name: Upload game RPK
        uses: actions/upload-artifact@v4
        with:
          name: VelaStore-${{ matrix.game }}-Debug-RPK
          path: games/artifacts/${{ matrix.game }}.debug.rpk
          if-no-files-found: error
