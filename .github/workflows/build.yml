name: Build VelaStore and Mini Games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  velastore:
    name: Build VelaStore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install VelaStore dependencies
        working-directory: watch
        run: npm install --no-audit --no-fund
      - name: Build VelaStore RPK
        working-directory: watch
        run: npm run build
      - name: Find and stage VelaStore RPK
        run: |
          set -euo pipefail
          RPK="$(find . -type f -name '*.debug.*.rpk' -not -path '*/node_modules/*' -print -quit)"
          test -n "$RPK"
          mkdir -p watch/artifacts
          cp "$RPK" watch/artifacts/
      - name: Upload VelaStore debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: VelaStore-Xiaomi-Vela-Debug-RPK
          path: watch/artifacts/*.debug.*.rpk
          if-no-files-found: error

  mini-games:
    name: Build ${{ matrix.game }} game
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [tap-rush, memory-match, 2048-mini, snake-lite]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install game dependencies
        working-directory: games/${{ matrix.game }}
        run: npm install --no-audit --no-fund
      - name: Build game RPK
        working-directory: games/${{ matrix.game }}
        run: npm run build
      - name: Find and stage game RPK
        run: |
          set -euo pipefail
          RPK="$(find . -type f -name '*.debug.*.rpk' -not -path '*/node_modules/*' -print -quit)"
          test -n "$RPK"
          mkdir -p games/artifacts
          cp "$RPK" "games/artifacts/${{ matrix.game }}.debug.rpk"
      - name: Upload game RPK
        uses: actions/upload-artifact@v4
        with:
          name: VelaStore-${{ matrix.game }}-Debug-RPK
          path: games/artifacts/${{ matrix.game }}.debug.rpk
          if-no-files-found: error


  publish-package:
    name: Publish one VelaStore package
    runs-on: ubuntu-latest
    needs: [velastore, mini-games]
    steps:
      - name: Download all built RPK files
        uses: actions/download-artifact@v4
        with:
          pattern: VelaStore-*-Debug-RPK
          path: dist
          merge-multiple: true
      - name: Create one ZIP and checksums
        run: |
          set -euo pipefail
          test "$(find dist -type f -name '*.rpk' | wc -l)" -ge 5
          (cd dist && sha256sum *.rpk > SHA256SUMS.txt)
          zip -j VelaStore-all-apps.zip dist/*.rpk dist/SHA256SUMS.txt
      - name: Publish package release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: VelaStore nightly package
          prerelease: true
          make_latest: false
          files: VelaStore-all-apps.zip
          body: |
            One ZIP containing VelaStore and the four demo game RPK packages.
            These are debug builds. Downloading a package does not guarantee that Xiaomi Watch S4 firmware permits installation.
