name: NesaOS openvela reference build

on:
  workflow_dispatch:
  push:
    branches:
      - nesaos-foundation
    paths:
      - "NesaOS/system/**"
      - ".github/workflows/nesaos-openvela-build.yml"

permissions:
  contents: read

concurrency:
  group: nesaos-openvela-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-reference:
    # This builds the upstream ARM64 Goldfish emulator target, NOT Watch S4 firmware.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out NesaOS repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc bison build-essential ccache curl flex git git-lfs             libncurses-dev libssl-dev lzop make python3 python3-pip             python3-venv rsync unzip wget xz-utils zip cmake ninja-build
          git lfs install
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          repo --version

      - name: Check available disk and memory
        run: |
          df -h /
          free -h

      - name: Build openvela ARM64 reference target
        env:
          JOBS: "2"
        run: |
          bash NesaOS/system/scripts/build_openvela_reference.sh "$RUNNER_TEMP/nesaos-openvela"

      - name: Upload build logs and manifest lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesaos-openvela-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/nesaos-openvela/nesaos-build-logs/
            ${{ runner.temp }}/nesaos-openvela/manifest.lock.xml
            ${{ runner.temp }}/nesaos-openvela/cmake_out/vela_goldfish-arm64-v8a-ap/
          if-no-files-found: warn
          retention-days: 14
